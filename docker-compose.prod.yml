services:
  # One service serves the pages, the assets and the websocket, on one port.
  # The browser builds its websocket url from the address it is already on, so
  # there is no second hostname to publish.
  app:
    restart: always
    image: ghcr.io/george-spanos/planning-poker-api:stable
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "127.0.0.1:45001:8080"
      - "[::1]:45001:8080"
